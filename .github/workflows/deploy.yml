name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment to build and deploy
        type: choice
        options:
          - staging
          - production
        required: true
      git_sha:
        description: Commit to build. Use the staging sha when promoting to production.
        type: string
        required: true

# GitHub secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, DEPLOY_SSH_KEY,
# DEPLOY_HOST, DEPLOY_USER, STAGING_BUILD_ENV, PROD_BUILD_ENV.
# STAGING_BUILD_ENV and PROD_BUILD_ENV are the dotenv files passed as the
# image build secret (NEXT_PUBLIC_* is baked in). Runtime env stays on the server.
# Put NEXT_PUBLIC_GADS_CHECKOUT_CONVERSION_SEND_TO only in PROD_BUILD_ENV
# (visatop.com checkout Ads). Leave it unset in STAGING_BUILD_ENV.
# Protect the production environment with a required reviewer.

jobs:
  deploy:
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
    concurrency:
      group: blue-green-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.git_sha || github.event.workflow_run.head_sha }}

      - name: Resolve commit
        id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Write build secret
        env:
          STAGING_BUILD_ENV: ${{ secrets.STAGING_BUILD_ENV }}
          PROD_BUILD_ENV: ${{ secrets.PROD_BUILD_ENV }}
        run: |
          if [[ "$ENVIRONMENT" == "production" ]]; then
            printf '%s\n' "$PROD_BUILD_ENV" > "$RUNNER_TEMP/build.env"
            if ! grep -Eq '^[[:space:]]*NEXT_PUBLIC_GADS_CHECKOUT_CONVERSION_SEND_TO=.+' "$RUNNER_TEMP/build.env"; then
              echo "warning: NEXT_PUBLIC_GADS_CHECKOUT_CONVERSION_SEND_TO is missing from PROD_BUILD_ENV; checkout Ads conversions will not fire" >&2
            fi
          else
            printf '%s\n' "$STAGING_BUILD_ENV" > "$RUNNER_TEMP/build.env"
            if grep -Eq '^[[:space:]]*NEXT_PUBLIC_GADS_CHECKOUT_CONVERSION_SEND_TO=.+' "$RUNNER_TEMP/build.env"; then
              echo "error: NEXT_PUBLIC_GADS_CHECKOUT_CONVERSION_SEND_TO must be unset in STAGING_BUILD_ENV" >&2
              exit 1
            fi
          fi
          test -s "$RUNNER_TEMP/build.env"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: |
            TARGETPLATFORM=linux/amd64
          secret-files: |
            env=${{ runner.temp }}/build.env
          tags: ${{ env.ENVIRONMENT == 'production' && 'alfarouk1995/visatop-next' || 'alfarouk1995/visatop-next-demo' }}:sha-${{ steps.rev.outputs.sha }}

      - name: Deploy on the droplet
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          image="alfarouk1995/visatop-next-demo:sha-${{ steps.rev.outputs.sha }}"
          if [[ "$ENVIRONMENT" == "production" ]]; then
            image="alfarouk1995/visatop-next:sha-${{ steps.rev.outputs.sha }}"
          fi
          ssh -i "$RUNNER_TEMP/deploy_key" \
            -o StrictHostKeyChecking=accept-new \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "bash -s -- deploy ${ENVIRONMENT} ${image}" \
            < scripts/blue-green-deploy.sh
