apiVersion: 1

contactPoints:
  - orgId: 1
    name: visatop-ops
    receivers:
      - uid: visatop_email
        type: email
        disableResolveMessage: false
        settings:
          addresses: $GRAFANA_ALERT_EMAIL
          singleEmail: true
          subject: |
            {{ template "default.title" . }}
      - uid: visatop_webhook
        type: webhook
        disableResolveMessage: false
        settings:
          url: $GRAFANA_ALERT_WEBHOOK_URL
          httpMethod: POST
          title: |
            {{ template "default.title" . }}
          message: |
            {{ template "default.message" . }}
