  <g fill="#012031" font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="188" y="118" font-size="10" fill="#5d7d8d">Surname / Nom</text>
    <text x="188" y="138" font-size="18" font-weight="700">EXAMPLE</text>
    <text x="188" y="166" font-size="10" fill="#5d7d8d">Given names / Prénoms</text>
    <text x="188" y="186" font-size="18" font-weight="700">JANE SAMPLE</text>
    <text x="188" y="214" font-size="10" fill="#5d7d8d">Nationality</text>
    <text x="188" y="232" font-size="14" font-weight="700">EXAMPLE</text>
    <text x="360" y="214" font-size="10" fill="#5d7d8d">Sex</text>
    <text x="360" y="232" font-size="14" font-weight="700">F</text>
    <text x="430" y="214" font-size="10" fill="#5d7d8d">Date of birth</text>
    <text x="430" y="232" font-size="14" font-weight="700">01 JAN 1990</text>
    <text x="188" y="260" font-size="10" fill="#5d7d8d">Passport No.</text>
    <text x="188" y="278" font-size="16" font-weight="700">X00000000</text>
