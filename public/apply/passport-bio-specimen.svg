    <text x="360" y="278" font-size="14" font-weight="700">01 JAN 2030</text>
  </g>
  <g fill="#1f4f6b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">
    <text x="36" y="330">P&lt;EXAMPLE&lt;&lt;JANE&lt;SAMPLE&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;</text>
    <text x="36" y="352">X00000000&lt;0EXAMPLE9001011F3001011&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;00</text>
  </g>
  <g transform="rotate(-18 320 210)" opacity="0.28">
    <text x="320" y="220" text-anchor="middle" fill="#c2410c" font-family="ui-sans-serif, system-ui, sans-serif" font-size="42" font-weight="800" letter-spacing="6">SPECIMEN</text>
  </g>
  <text x="320" y="386" text-anchor="middle" fill="#5d7d8d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Not a real travel document · For camera guidance only</text>
