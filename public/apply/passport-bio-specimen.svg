<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="specimenTitle specimenDesc">
  <title id="specimenTitle">Example passport bio page (specimen)</title>
  <desc id="specimenDesc">A clearly fake illustrated passport identity page for capture guidance. Not a real travel document.</desc>
  <rect width="640" height="420" rx="18" fill="#e8eef2"/>
  <rect x="16" y="16" width="608" height="388" rx="12" fill="#f7fafc" stroke="#1f4f6b" stroke-width="3"/>
  <rect x="16" y="16" width="608" height="64" rx="12" fill="#1f4f6b"/>
  <rect x="16" y="52" width="608" height="28" fill="#1f4f6b"/>
  <text x="320" y="42" text-anchor="middle" fill="#f7d774" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="2">REPUBLIC OF EXAMPLE</text>
  <text x="320" y="62" text-anchor="middle" fill="#ffffff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" letter-spacing="3">PASSPORT · PASSEPORT · SPECIMEN</text>
  <rect x="36" y="96" width="132" height="168" rx="6" fill="#d7e3ea" stroke="#5d7d8d" stroke-width="2"/>
  <circle cx="102" cy="154" r="28" fill="#8aa4b3"/>
  <ellipse cx="102" cy="220" rx="44" ry="32" fill="#8aa4b3"/>
